<div class="xi-site" data-page="AdminInsights" id="xi-site-root">
<header class="xi-top">
    <button type="button" class="xi-burger" aria-label="Menu" onclick="AdminInsightsJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="xi-logo" href="Admin"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="4" fill="#14233F"/><path d="M9 11v18M9 20h8M17 11v18M22 11l5 18 5-18" fill="none" stroke="#B08D4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="xi-brand">Staff</span><small>Staff</small></a>
    <div class="xi-who" id="xi-who"></div>
    <a class="xi-tl xi-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="xi-tl" onclick="AdminInsightsJs.signout()">Sign out</button>
</header>
<div class="xi-body">
    <nav class="xi-rail" id="xi-rail" aria-label="Staff menu">
        <div class="xi-rail-top"><b>Menu</b><button type="button" class="xi-ibtn" aria-label="Close menu" onclick="AdminInsightsJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="xi-menu" id="xi-menu"></div>
    </nav>
    <div class="xi-scrim" id="xi-scrim" onclick="AdminInsightsJs.closeMenu()"></div>
    <main class="xi-main" id="xi-main"><div class="xi-loading">Loading</div></main>
</div>
<div class="xi-modal" id="xi-modal" aria-hidden="true">
    <div class="xi-mbox" role="dialog" aria-modal="true" aria-labelledby="xi-mtitle">
        <div class="xi-mhead"><h2 id="xi-mtitle"></h2><button type="button" class="xi-ibtn" aria-label="Close" onclick="AdminInsightsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="xi-mbody" id="xi-mbody"></div>
    </div>
</div>
<div class="xi-pk" id="xi-pk" aria-hidden="true">
    <div class="xi-mbox xi-pkbox" role="dialog" aria-modal="true" aria-labelledby="xi-pkt">
        <div class="xi-mhead"><h2 id="xi-pkt">Choose from the media library</h2><button type="button" class="xi-ibtn" aria-label="Close" onclick="AdminInsightsJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="xi-mbody">
            <div class="xi-pkbar"><input type="search" id="xi-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminInsightsJs.pkSearch()" aria-label="Search media"><label class="xi-btn xi-btn-ghost xi-btn-sm xi-upbtn"><input type="file" id="xi-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminInsightsJs.pkUpload()">Upload new</label></div>
            <p class="xi-upmsg" id="xi-pkmsg" role="status"></p>
            <div class="xi-pkgrid" id="xi-pkgrid"></div>
        </div>
    </div>
</div>
<div class="xi-toast" id="xi-toast" role="status" aria-live="polite"></div>
</div>
